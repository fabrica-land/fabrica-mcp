type PoolLendingLiquidityModel {
  activeLoan: PoolLendingLoanModel

  """
  Why the pool-lending oracle appraisal is forced to 0, or null. Non-null ONLY for the two tax-status reasons — every other cause (the ENG-3813 fraud/fishy gate included) resolves to null, since this field is publicly queryable without auth. null does not by itself mean borrowing is available: check maxPrincipalUsdc.
  """
  appraisalBlockReason: AppraisalBlockReason
  durations: [Int!]!

  """
  `maxPrincipalUsdc` divided by 1e6, as a decimal string in whole currency units; may carry a fractional part (e.g. 1.5). Same caveats: advertised signed-appraisal / oracle capacity, not router-sourceable liquidity.
  """
  maxPrincipalScaled: String!

  """
  Advertised borrowing capacity in the currency token (USDC, 6 decimals): the largest principal any single pool forecasts from its tick liquidity against that pool's collateral price. Signed-quote pools use `oracleValuation.quote.price`. Onchain pools use `onchainValuation.usablePriceUsdc6` ONLY when `aggregatorReadAddress` is the pool's `priceOracle()`; a split pool contributes zero even when that price is set. Pools with no usable price also contribute zero. Net of the active loan on that pool. This is an off-chain forecast, not the amount the MetaStreet router can actually source — the router's on-chain sourcing can come out lower and the two can disagree; quote the real amount before presenting it as borrowable.
  """
  maxPrincipalUsdc: String!
  pools: [PoolLendingPoolModel!]!
}

type PoolLendingLoanModel {
  borrowerAddress: String!
  collateralTokenIds: [String!]!
  duration: String!
  id: String!
  interests: [String!]!
  loanReceipt: String!
  maturity: String!
  poolAddress: String!
  principal: String!
  repayment: String!
  ticks: [String!]!
  timestamp: String!
  useds: [String!]!
}

"""
The subgraph's `OnchainPrice` row for this token: the RAW canonical price the fact store holds, before any eligibility gate. This is NOT the price the pool lends against. `onchainValuation.usablePriceUsdc6` is the READ aggregator's price; borrow capacity uses it only when `aggregatorReadAddress` is the pool's `priceOracle()`, and is zero when they differ. Only populated for OnchainOracle pools inside `Token.poolLendingLiquidity`.
"""
type PoolLendingOnchainPriceModel {
  """Publisher confidence in basis points (0–10000)."""
  confidenceScore: Int

  """
  Keeper cycle the price was written in. A `cycle` below `oracleFeed.minValidCycle` was invalidated by `CycleInvalidated`.
  """
  cycle: String

  """
  Raw canonical source price in USDC (6 decimals) per unit of token supply, as written to the fact store. Informational only: it can be stale, invalidated or otherwise ineligible. Null until the first `PriceWritten` for a registered token, or while the indexer is unavailable (see `oracleFeed.indexerUnavailableReason`).
  """
  priceUsdc6: String

  """Id of the source the canonical price was taken from."""
  sourceId: Int

  """Unix seconds at which the publisher valued the token."""
  valuedAt: String
}

"""
What the read aggregator answers for THIS token right now. When `aggregatorReadAddress` equals the pool's `priceOracleAddress`, these are the inputs that pool uses at execution and `usablePriceUsdc6` is the price it lends against. When they differ, `capacityBlockReason` is `oracle_read_not_pool_oracle` and `maxPrincipalUsdc` does not use this object. Not `onchainPrice.priceUsdc6`. Only populated inside `Token.poolLendingLiquidity`.
"""
type PoolLendingOnchainValuationModel {
  """
  ENG-4414: the aggregator `eligibilityReport` and `price()` were read from. Equal to the pool's `priceOracleAddress` when the pool has no separate read address. When it differs, borrow capacity from this pool is zero even if `usablePriceUsdc6` is set.
  """
  aggregatorReadAddress: String

  """
  ENG-4414: `oracle_read_not_pool_oracle` when `aggregatorReadAddress` is not the pool's `priceOracleAddress`, so this pool contributes zero borrow capacity even if `usablePriceUsdc6` is set. Null when the two addresses are the same, including when the read was unset.
  """
  capacityBlockReason: String

  """
  Why `usablePriceUsdc6` is null: the first failed aggregator gate (`heartbeat`, `registry`, `recovery`, `currency`, `max_silence`, `min_sources`, `dispersion`, `land_use`, `eligibility_unattested` (eligibility writer has not attested this token), `eligibility` (a required eligibility pair is not passing), `eligibility_region_unattested` (missing, locked, stale, zero, or reserved vacancy), `eligibility_region` (a country or region is not allowed), `eligibility_vacant_land` (vacancy is not vacant)) or an API-side read failure (`price_unavailable`, `eligibility_unavailable`, `oracle_state_unavailable`). Null when `usablePriceUsdc6` is set.
  """
  failedCheck: String

  """
  The read aggregator's live `price()` in USDC (6 decimals) per unit of token supply, after every eligibility check passed. This is the price the pool lends against only when `aggregatorReadAddress` is the pool's `priceOracle()`. Differs from `onchainPrice.priceUsdc6` (the raw canonical source price) by design. Null whenever a check fails or the oracle could not be read; `failedCheck` then names why.
  """
  usablePriceUsdc6: String
}

"""
The READ aggregator's freshness surface. `isStale` is that aggregator's freshness, not the pool's `priceOracle()` gate: on a split, borrow capacity is zero regardless of `isStale`. The subgraph-sourced fields (`lastHeartbeat`, `currentCycle`, `minValidCycle`) are null when the indexer could not be read (see `indexerUnavailableReason`) or has no legacy validator row yet; `isStale` and `maxSilence` are read live on-chain and always reported. Only populated inside `Token.poolLendingLiquidity`.
"""
type PoolLendingOracleFeedModel {
  """
  The legacy validator's current keeper cycle, from the subgraph. Null for Round 3 aggregators, while the indexer is unavailable, or before the first write.
  """
  currentCycle: String

  """
  `indexer_unavailable` when the subgraph rows (`onchainPrice` and the subgraph-sourced fields here) could not be read — an indexer outage or rate limit. The aggregator's live verdict (`isStale`, `onchainValuation`) is unaffected and borrowing capacity is preserved. Null when the subgraph was read.
  """
  indexerUnavailableReason: String

  """
  `isStale` is the READ aggregator's freshness verdict: true when the legacy `isHeartbeatFresh(validatorId)` gate reports the feed not fresh, or, for Round 3 feeds, when the `max_silence` check fails or the eligibility read fails (`eligibility_unavailable`). Capacity never reads this bit; a split read/execution oracle zeros capacity regardless (see `capacityBlockReason`).
  """
  isStale: Boolean!

  """
  Unix seconds of the last keeper heartbeat, from the subgraph (may lag the chain by the indexing delay). Null before the first heartbeat or while the indexer is unavailable. Do not derive staleness from this and the wall clock — use `isStale`.
  """
  lastHeartbeat: String

  """
  Seconds of silence after `lastHeartbeat` before the feed is stale, read live from the fact store or Round 3 aggregator `maxSilence()`.
  """
  maxSilence: String!

  """
  Lowest keeper cycle still considered valid, from the subgraph. A price whose `cycle` is below this was invalidated. Null for Round 3 aggregators, while the indexer is unavailable, or before the first write.
  """
  minValidCycle: String
}

"""
The API's EIP-712 appraisal for a SignedQuote pool. The `quote` is always returned; the `signature` is present only when the API signs (null for premints and fraud-blocked tokens, whose quote is display-only and which the pool refuses). The borrower packs quote + signature into `oracleContext`. `quote.price` is the collateral price in the currency token (USDC, 6 decimals) and the input to `maxPrincipalUsdc` for SignedQuote pools. Never populated for OnchainOracle pools.
"""
type PoolLendingOracleValuationModel {
  """
  The EIP-712 quote payload. `price` is the appraised collateral value in the currency token (USDC, 6 decimals); a `0` price means the API found no valid valuation (fail-closed) and the pool will refuse the loan.
  """
  quote: PoolLendingQuoteModel!

  """
  The API signer's EIP-712 signature over `quote`, required in `oracleContext` to borrow. Null when the API deliberately does not sign: premints (no token yet) and fraud-blocked tokens, whose quote is returned for display only.
  """
  signature: String
}

type PoolLendingPoolModel {
  address: String!
  collateralToken: PoolLendingCollateralTokenModel!
  currencyToken: PoolLendingCurrencyTokenModel!
  durations: [Float!]!
  fiatTransactions: [FiatTransactionModel!]
  loansActive: String!
  network: String!

  """
  Raw canonical source price from the subgraph (informational). Null for SignedQuote pools, on depositor-side reads, and while the indexer is unavailable. Not the price the pool lends against — see `onchainValuation`.
  """
  onchainPrice: PoolLendingOnchainPriceModel

  """
  The read aggregator's live verdict. `usablePriceUsdc6` is the price the pool lends against only when `aggregatorReadAddress` is this pool's `priceOracle()`; otherwise it is an observation and this pool contributes zero borrow capacity. Null for SignedQuote pools and on depositor-side reads.
  """
  onchainValuation: PoolLendingOnchainValuationModel

  """
  `isStale` is the READ aggregator's freshness verdict: true when the legacy `isHeartbeatFresh(validatorId)` gate reports the feed not fresh, or, for Round 3 feeds, when the `max_silence` check fails or the eligibility read fails (`eligibility_unavailable`). Capacity never reads this bit; a split read/execution oracle zeros capacity regardless (see `capacityBlockReason`). Null for SignedQuote pools and on depositor-side reads.
  """
  oracleFeed: PoolLendingOracleFeedModel

  """
  The appraisal quote (and, when the API signs, its EIP-712 signature) for a SignedQuote pool. Null by design for OnchainOracle pools (ENG-3894) — switch on `pricing` before reading it — and unset on depositor-side reads (`Query.poolLendingPools`).
  """
  oracleValuation: PoolLendingOracleValuationModel

  """
  The pool's `priceOracle()` (a FabricaOracleAggregator) for OnchainOracle pools; null for SignedQuote pools.
  """
  priceOracleAddress: String

  """
  How this pool values collateral. Inside `Token.poolLendingLiquidity`: SignedQuote pools populate `oracleValuation`; OnchainOracle pools populate `onchainPrice`, `oracleFeed` and `onchainValuation` and leave `oracleValuation` null. Depositor-side reads (`Query.poolLendingPools`) leave all of them unset.
  """
  pricing: PoolLendingPricing!
  rates: [Float!]!
  ticks: [PoolLendingTickModel!]!
}

type PoolLendingPoolsResultModel {
  blockTimestamp: String
  pools: [PoolLendingPoolModel!]!
}

"""
How a pool values its collateral. Consumers must switch on this field. Inside `Token.poolLendingLiquidity` (borrower-side), SignedQuote pools populate `oracleValuation` while OnchainOracle pools leave `oracleValuation` null by design (ENG-3894) and populate `onchainPrice`, `oracleFeed` and `onchainValuation` instead. Depositor-side reads (`Query.poolLendingPools`) leave every valuation field unset.
"""
enum PoolLendingPricing {
  """
  The pool's price oracle is a FabricaOracleAggregator that reads the on-chain fact store at execution time. No signed quote exists (the API never signs for such a pool), `oracleContext` is empty on borrow/refinance, and `oracleValuation` is null. `onchainPrice`, `oracleFeed` and `onchainValuation` are populated only inside `Token.poolLendingLiquidity`.
  """
  OnchainOracle

  """
  The API returns an EIP-712 appraisal quote (`oracleValuation.quote`, inside `Token.poolLendingLiquidity`) and signs it only when the token is borrowable: `oracleValuation.signature` is null for premints and fraud-blocked tokens, whose quote is display-only and which the pool refuses. The borrower packs quote + signature into `oracleContext` and the pool's price oracle verifies the signature on-chain. `onchainPrice`, `oracleFeed` and `onchainValuation` are null.
  """
  SignedQuote
}

