<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fabrica property</title>
<style>
  /* Fabrica brand face, served by the hosted MCP server (FONT_ORIGIN in src/ui/property-card.ts).
     Until it loads, or where a host blocks it, the system face is used. */
  @font-face { font-family: "Open Sauce Two"; font-weight: 400; font-display: swap;
    src: url("https://mcp.fabrica.land/fonts/OpenSauceTwo-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Open Sauce Two"; font-weight: 600; font-display: swap;
    src: url("https://mcp.fabrica.land/fonts/OpenSauceTwo-SemiBold.woff2") format("woff2"); }
  @font-face { font-family: "Open Sauce Two"; font-weight: 700; font-display: swap;
    src: url("https://mcp.fabrica.land/fonts/OpenSauceTwo-Bold.woff2") format("woff2"); }
  :root {
    --bg: #ffffff; --fg: #111318; --muted: #5d6270; --line: #e6e8ee; --tile: #f3f4f7;
    --accent: #1e28ff; --accent-fg: #ffffff; --accent-text: #1e28ff; --warn-bg: #fff4e0; --warn-fg: #7a4a00;
    --tip-bg: #111318; --tip-fg: #f3f4f7;
    --safe-top: 0px; --safe-right: 0px; --safe-bottom: 0px; --safe-left: 0px;
  }
  :root[data-theme="dark"] {
    --bg: #17181c; --fg: #f2f3f5; --muted: #a2a7b3; --line: #2c2e35; --tile: #22242a;
    --accent: #1e28ff; --accent-fg: #ffffff; --accent-text: #8d93ff; --warn-bg: #3a2c12; --warn-fg: #ffd58a;
    --tip-bg: #f3f4f7; --tip-fg: #111318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.45 "Open Sauce Two", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { padding: calc(14px + var(--safe-top)) calc(14px + var(--safe-right)) calc(14px + var(--safe-bottom)) calc(14px + var(--safe-left));
    display: grid; gap: 12px; }

  .gallery { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 34%; aspect-ratio: 3 / 4; scroll-snap-align: start; border-radius: 14px;
    overflow: hidden; background: var(--tile); border: 0; padding: 0; cursor: pointer; }
  .slide:first-child { flex-basis: 64%; aspect-ratio: auto; }
  .slide:only-child { flex-basis: 100%; aspect-ratio: 16 / 10; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide .tag { position: absolute; left: 10px; bottom: 10px; padding: 3px 10px; border-radius: 999px;
    background: rgba(17, 19, 24, 0.78); color: #fff; font-size: 12px; font-weight: 600; }
  .slide .fallback { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: -4px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width 0.15s; }
  .dot.on { width: 18px; background: var(--fg); }

  .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .titles { min-width: 0; }
  h2 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .pill { flex: none; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--tile); }

  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .facts.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .facts.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .fact { background: var(--tile); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .fact .k { color: var(--muted); font-size: 12px; }
  .fact .v { font-size: 18px; font-weight: 700; margin-top: 2px; letter-spacing: -0.01em; }
  .fact .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .checks { position: relative; padding: 0; }
  .fact-toggle { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none;
    border: 0; padding: 12px 14px; border-radius: 14px; cursor: pointer; }
  .fact-toggle:disabled { cursor: default; }
  .fact-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tip { display: none; margin: 0; padding: 0 14px 12px 30px; font-size: 12px; color: var(--muted); }
  .checks.open .tip { display: block; }
  :root[data-hover="true"][data-layout="regular"] .checks:hover .tip { display: block; position: absolute; z-index: 2;
    left: 0; top: calc(100% + 6px); width: max(100%, 240px); padding: 10px 14px 10px 28px; border-radius: 12px;
    background: var(--tip-bg); color: var(--tip-fg); }

  .warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .desc { margin: 0; color: var(--fg); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .notice { color: var(--muted); font-size: 12px; }
  .cta, .secondary { min-height: 44px; border-radius: 12px; padding: 0 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .cta { background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent); }
  .secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .link { min-height: 44px; background: none; border: 0; padding: 0 4px; font: inherit; font-weight: 600; color: var(--accent-text); cursor: pointer; margin-left: auto; }
  .cta:focus-visible, .secondary:focus-visible, .link:focus-visible, .slide:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  .muted { color: var(--muted); }

  /* Compact: phones and narrow containers. One column, swipe gallery, 2-up facts,
     full-width actions pinned to the bottom of the card. */
  :root[data-layout="compact"] .card { gap: 10px; }
  :root[data-layout="compact"] .slide { flex-basis: 100%; aspect-ratio: 4 / 3; }
  :root[data-layout="compact"] .slide:first-child { aspect-ratio: 4 / 3; }
  :root[data-layout="compact"] h2 { font-size: 18px; }
  :root[data-layout="compact"] .pill { display: none; }
  :root[data-layout="compact"] .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  :root[data-layout="compact"] .chip { white-space: nowrap; }
  :root[data-layout="compact"] .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  :root[data-layout="compact"] .facts > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  :root[data-layout="compact"] .actions { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1fr;
    margin: 0 calc(-14px - var(--safe-right)) calc(-14px - var(--safe-bottom)) calc(-14px - var(--safe-left));
    padding: 10px calc(14px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(14px + var(--safe-left));
    background: var(--bg); border-top: 1px solid var(--line); }
  :root[data-layout="compact"] .actions .cta:first-child { grid-column: 1 / -1; min-height: 50px; font-size: 16px; }
  :root[data-layout="compact"] .actions > .secondary:nth-child(2):nth-last-child(2) { grid-column: 1 / -1; }
  :root[data-layout="compact"] .link { grid-column: 1 / -1; margin: 0; }
</style>
</head>
<body>
<main id="root" class="card"><p class="muted">Loading property…</p></main>
<!-- APP_SCRIPT -->
</body>
</html>
